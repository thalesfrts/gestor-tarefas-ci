<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Tarefas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; cursor: pointer; }
    #error-msg { color: #dc2626; min-height: 20px; margin: 4px 0 12px; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Gerenciador de Tarefas</h1>
  <form id="task-form">
    <input id="task-input" type="text" placeholder="Digite uma nova tarefa..." />
    <button type="submit">Adicionar</button>
  </form>
  <p id="error-msg"></p>
  <ul id="task-list"></ul>

  <script src="app.js"></script>
</body>
</html>
